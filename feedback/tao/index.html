<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tạo link feedback</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --dark: #000; --light: #f8f7f5; --accent: #c6e65c; }
  body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--dark); color: var(--light); line-height: 1.7; padding: 48px 24px 80px; }
  .wrap { max-width: 620px; margin: 0 auto; }
  h1 { font-family: 'DM Serif Display', serif; font-size: 38px; line-height: 1.1; margin-bottom: 12px; }
  .sub { color: rgba(248,247,245,.5); font-size: 15px; margin-bottom: 36px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .hint { font-size: 13px; color: rgba(248,247,245,.4); font-weight: 400; margin-top: 3px; }
  input[type=text] {
    width: 100%; background: rgba(248,247,245,.04); border: 1px solid rgba(248,247,245,.14);
    color: var(--light); font-family: inherit; font-size: 15px; padding: 13px 14px; outline: none;
    margin-bottom: 22px; border-radius: 0; -webkit-appearance: none;
  }
  input:focus { border-color: rgba(198,230,92,.55); }
  ::placeholder { color: rgba(248,247,245,.2); }
  button { background: var(--accent); color: var(--dark); border: 0; padding: 15px 28px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { opacity: .85; }
  .out { display: none; margin-top: 34px; border: 1px solid rgba(198,230,92,.35); background: rgba(198,230,92,.07); padding: 22px; }
  .out b { color: var(--accent); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 12px; }
  .link { word-break: break-all; font-size: 14px; color: var(--light); background: rgba(0,0,0,.4); padding: 14px; border: 1px solid rgba(248,247,245,.1); }
  .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .row button { flex: 1; min-width: 140px; }
  .ghost { background: transparent; color: var(--accent); border: 1px solid rgba(198,230,92,.4); }
  .note { margin-top: 30px; font-size: 14px; color: rgba(248,247,245,.45); border-left: 2px solid rgba(198,230,92,.4); padding-left: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tạo link feedback</h1>
  <p class="sub">Điền tài liệu của một học viên, bấm tạo, rồi gửi link đó cho riêng họ.</p>

  <label>Tên học viên
    <span class="hint">Hiện sẵn trong form, để bạn biết ai gửi feedback.</span>
  </label>
  <input type="text" id="ten" placeholder="Linh · @linh.shop">

  <label>Link report riêng của học viên này
    <span class="hint">Nhớ để quyền xem là bất kỳ ai có link.</span>
  </label>
  <input type="text" id="report" placeholder="https://docs.google.com/...">

  <label>Link tài liệu buổi học
    <span class="hint">Nếu ai cũng nhận cùng một file thì điền một lần, lần sau nó tự nhớ.</span>
  </label>
  <input type="text" id="doc" placeholder="https://docs.google.com/...">

  <button onclick="tao()">Tạo link</button>

  <div class="out" id="out">
    <b>Link gửi cho học viên</b>
    <div class="link" id="link"></div>
    <div class="row">
      <button onclick="chep()" id="btnChep">Copy link</button>
      <button class="ghost" onclick="window.open(document.getElementById('link').textContent, '_blank')">Mở thử</button>
    </div>
  </div>

  <p class="note">Trang này chỉ để bạn dùng. Đừng gửi link của chính trang này cho học viên.</p>
</div>

<script>
var GOC = location.origin + '/ig/feedback/';

try {
  var nho = localStorage.getItem('fb_doc_chung');
  if (nho) document.getElementById('doc').value = nho;
} catch (e) {}

function tao() {
  var t = document.getElementById('ten').value.trim();
  var r = document.getElementById('report').value.trim();
  var d = document.getElementById('doc').value.trim();
  if (!r && !d) { alert('Bạn điền ít nhất một link tài liệu nha.'); return; }
  try { localStorage.setItem('fb_doc_chung', d); } catch (e) {}

  var obj = {}; if (t) obj.t = t; if (r) obj.r = r; if (d) obj.d = d;
  var k = btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  document.getElementById('link').textContent = GOC + '?k=' + k;
  document.getElementById('out').style.display = 'block';
}

function chep() {
  var s = document.getElementById('link').textContent;
  navigator.clipboard.writeText(s).then(function () {
    var b = document.getElementById('btnChep');
    b.textContent = 'Đã copy'; setTimeout(function () { b.textContent = 'Copy link'; }, 1600);
  });
}
</script>
</body>
</html>
